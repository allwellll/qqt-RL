<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>低质量对局 · Replay Review</title><link rel="stylesheet" href="review.css"><link rel="icon" href="assets/point.png"></head>
<body>
<header><a href="index.html" class="brand">QQT <span>/</span> 回放诊断</a><span class="header-label">H7 · 离线 CPU</span><button id="advanced-open" aria-expanded="false" aria-controls="advanced-settings">高阶设置</button><span id="notice" role="status">正在读取录像目录</span></header>
<section id="advanced-settings" hidden>
  <div class="auth-tools"><button id="advanced-close">关闭诊断台</button><button id="advanced-forget">忘记本设备授权 / 锁定高阶设置</button></div>
  <main class="workspace">
    <aside class="library"><div class="section-title"><h1>对局录像</h1><span id="count"></span></div><input id="filter" type="search" placeholder="筛选 seed / 失败标签" aria-label="筛选对局"><div id="replay-list"></div><div class="library-foot" id="catalog-meta"></div></aside>
    <section class="center">
      <div class="episode-head"><div><h2 id="episode-title">H7 g32</h2><p id="episode-meta"></p></div><span class="badge" id="terminal"></span></div>
      <div class="board"><canvas id="game" width="900" height="810" aria-label="生产模拟器回放画布"></canvas><div id="canvas-loading">正在验证录像</div></div>
      <div class="position" id="position-panel"><div><span id="play-state">已暂停</span><strong id="exact-time">tick 0 · 00:00.000</strong></div><div class="locator-row"><input id="locator" readonly aria-label="可复制定位字符串"><button id="copy-position" title="复制当前定位" aria-label="复制当前定位"><img src="assets/review-icons/copy.svg" alt=""></button><button id="copy-link" title="复制深链" aria-label="复制深链"><img src="assets/review-icons/link.svg" alt=""></button></div></div>
      <div class="transport"><button id="replay-start" title="重播" aria-label="重播"><img src="assets/review-icons/rotate-ccw.svg" alt=""></button><button id="step-back" title="后退一 tick" aria-label="后退一 tick"><img src="assets/review-icons/skip-back.svg" alt=""></button><button id="play" title="播放" aria-label="播放"><img id="play-icon" src="assets/review-icons/play.svg" alt=""></button><button id="step-next" title="前进一 tick" aria-label="前进一 tick"><img src="assets/review-icons/skip-forward.svg" alt=""></button><select id="speed" aria-label="播放速度"><option value="0.25">0.25x</option><option value="0.5">0.5x</option><option value="1" selected>1x</option><option value="2">2x</option><option value="4">4x</option></select><input id="seek" type="range" min="0" max="2400" value="0" aria-label="跳转 tick"><output id="duration"></output></div>
      <div class="timeline-head"><h3>时间轴</h3><label>缩放 <input id="zoom" type="range" min="1" max="8" step="1" value="1"></label><span><i class="dot phase"></i>阶段 <i class="dot event"></i>事件 <i class="dot reward"></i>Reward <i class="dot annotation"></i>标注</span></div>
      <div id="timeline-scroll"><div id="timeline" aria-label="可点击时间轴"><div id="ruler"></div><div id="phase-track" class="track"></div><div id="event-track" class="track"></div><div id="reward-track" class="track"></div><div id="annotation-track" class="track"></div><div id="playhead"></div></div></div>
      <div class="annotation-head"><h3>标注 <span id="annotation-count">0</span></h3><div><button id="add-annotation" title="标记当前 tick" aria-label="标记当前 tick"><img src="assets/review-icons/plus.svg" alt=""></button><button id="export-annotations" title="导出 annotations.json" aria-label="导出 annotations.json"><img src="assets/review-icons/download.svg" alt=""></button><button id="import-annotations" title="导入 annotations.json" aria-label="导入 annotations.json"><img src="assets/review-icons/upload.svg" alt=""></button><input id="annotation-file" type="file" accept="application/json,.json" hidden></div></div>
      <form id="annotation-form" hidden><label>tick <input id="annotation-tick" type="number" min="0" required></label><label>类别 <select id="annotation-category"><option value="pickup">拾包</option><option value="window">窗口</option><option value="return">返程</option><option value="delivery">交付</option><option value="safety">安全</option><option value="other">其他</option></select></label><label>严重度 <select id="annotation-severity"><option value="low">低</option><option value="medium" selected>中</option><option value="high">高</option></select></label><label class="note">备注 <textarea id="annotation-note" maxlength="2000" rows="2"></textarea></label><button type="submit">保存标注</button><button id="cancel-annotation" type="button">取消</button></form>
      <div id="annotations"></div>
    </section>
    <aside class="inspector"><div class="section-title"><h2>当前状态</h2><span id="integrity" class="badge">验证中</span></div><div class="reward-total"><span>Reward Δ / 累计</span><select id="reward-player" aria-label="Reward 玩家"><option value="0">模型 P0</option><option value="1">对手 P1</option></select><strong><b id="reward-delta">0</b><span>/</span><b id="reward-total">0</b></strong></div><div id="components"></div><div class="chart-controls"><select id="curve-component" aria-label="曲线分量"><option value="total">总 Reward</option></select><select id="curve-mode" aria-label="曲线模式"><option value="cumulative">累计</option><option value="delta">分量增量</option></select></div><canvas id="reward-chart" width="560" height="220" aria-label="Reward 曲线"></canvas><div id="state-details"></div><h3>当前关键事件</h3><div id="current-events"></div><h3>教师</h3><dl id="teacher"></dl><details><summary>真实性与协议</summary><div id="provenance"></div></details></aside>
  </main>
</section>
<dialog id="password-dialog" aria-labelledby="password-title"><button type="button" data-dialog-close class="dialog-close" aria-label="关闭密码框">×</button><h2 id="password-title">高阶设置</h2><form id="password-form"><label>设置密码<input id="settings-password" type="password" autocomplete="off" required></label><p id="password-status" role="status">验证成功后记住本设备。</p><button type="submit">解锁</button></form></dialog>
<script src="device_auth.js"></script><script src="ui_panels.js"></script><script src="sim.js"></script><script src="review_protocol.js"></script><script src="visual_renderer.js"></script><script src="review.js"></script>
</body></html>
