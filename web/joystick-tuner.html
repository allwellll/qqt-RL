<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>QQT 摇杆参数调试台</title>
<style>
:root{color-scheme:dark;--bg:#0b1216;--panel:#152329;--line:#30454e;--text:#ecf5f5;--muted:#99afb4;--accent:#64e0bc;--warn:#ffd166;--brick:#9a5b42;--wall:#365b65}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 system-ui,sans-serif}body{min-height:100dvh}button,select,input{font:inherit}main{width:min(1180px,100%);margin:auto;padding:clamp(10px,3vw,24px)}h1{margin:0;font-size:clamp(20px,5vw,28px)}h2{margin:0;font-size:16px}.sub,.hint{color:var(--muted)}.sub{margin:4px 0 12px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:14px}.game-panel,.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px}.game-panel{padding:clamp(8px,2vw,16px)}.game-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}.game-head .hint{font-size:12px}.board-wrap{width:100%;max-width:760px;margin:auto;background:#081014;border:1px solid #42616b;border-radius:8px;overflow:hidden;box-shadow:0 10px 35px #0008}.board-wrap canvas{display:block;width:100%;height:auto;aspect-ratio:15/13;image-rendering:auto}.touch-caption{text-align:center;color:var(--muted);font-size:12px;margin:8px 0 5px}.control-zone{position:relative;height:clamp(190px,42vw,270px);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:contain;background:radial-gradient(circle at 50% 50%,#223e44,#111d22 68%);border:1px solid #3d5961;border-radius:12px;overflow:hidden}.control-zone *{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;pointer-events:none}.touch-stick{position:absolute;left:50%;top:50%;width:clamp(118px,30vw,154px);height:clamp(118px,30vw,154px);transform:translate(-50%,-50%);display:grid;place-items:center;border:2px solid #78949a;border-radius:50%;color:var(--accent);font-size:40px;background:#1a3035cc;box-shadow:inset 0 0 0 18px #162a2f,inset 0 0 0 19px #66838a55}.touch-stick:after{content:'';position:absolute;inset:24%;border:1px dashed #85a4a955;border-radius:50%}.control-zone[data-active=true]{background:radial-gradient(circle at 50% 50%,#2a5757,#14262c)}#angle-chart{display:block;width:100%;height:130px;margin:8px 0 2px;background:#0b171b;border:1px solid #29434a;border-radius:7px;touch-action:pan-y}.chart-head{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px}.chart-head b{font-size:18px;color:var(--accent);font-variant-numeric:tabular-nums}.panel{padding:14px}.panel details+details{margin-top:10px}summary{cursor:pointer;font-weight:700;padding:2px 0}.control{margin:14px 0}.control-head{display:flex;justify-content:space-between}.value{color:var(--accent)}input[type=range]{width:100%;accent-color:var(--accent)}select{width:100%;padding:9px;background:#0e191d;color:var(--text);border:1px solid var(--line);border-radius:6px;margin:7px 0}.buttons{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}button{border:1px solid #5c777d;background:#21383e;color:var(--text);padding:9px 11px;border-radius:6px}button:active{transform:translateY(1px)}.log{height:180px;overflow:auto;background:#091014;padding:8px;font:11px ui-monospace,monospace;color:#bdd0d2;white-space:pre-wrap}.status{color:var(--warn);min-height:20px;margin-top:7px}.mobile-only{display:none}@media(max-width:720px){main{padding:10px 10px calc(18px + env(safe-area-inset-bottom))}.layout{display:block}.panel{margin-top:10px}.desktop-diagnostics{display:none}.mobile-only{display:inline}.game-head{align-items:flex-start}.game-head .hint{max-width:55%;text-align:right}.board-wrap{border-radius:7px}.panel{border-radius:9px}.touch-caption{margin-top:9px}.readout{margin-bottom:4px}.game-panel{padding:8px;background:#132126}}
@media(min-width:721px){.game-panel{min-width:0}.control-zone{height:210px}}
.readout{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}.metric{padding:8px;background:#0e191d;border-radius:6px}.metric small{display:block;color:var(--muted)}.metric b{color:var(--accent)}#angle-chart,.chart-head{grid-column:1/-1}#stick-angle-overlay{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}#stick-angle-label{position:absolute;top:8px;left:8px;z-index:3;padding:4px 7px;background:#081014cc;font-size:12px;color:#fff}
</style>
</head>
<body><main>
<h1>QQT 摇杆参数调试台</h1><p class="sub">手机优先的游戏画面试跑。调整参数后，直接拖动下方摇杆观察角色走位。</p>
<div class="layout">
<section class="game-panel"><div class="game-head"><div><h2>训练场 · 墙角与泡泡</h2><span class="hint">绿色方框显示角色碰撞范围</span></div><button id="restart">重新开始</button></div><div class="board-wrap"><canvas id="board" width="750" height="650" aria-label="QQT 游戏训练场"></canvas></div><div class="touch-caption">触控区：滑动控制方向。蓝线是轨迹，绿线是当前判定段。</div><div id="direction-zone" class="control-zone" data-floating-direction aria-label="游戏摇杆"><div class="touch-stick">✥</div><canvas id="stick-angle-overlay" aria-label="实时角度、手指轨迹和斜向边界"></canvas><span id="stick-angle-label">拖动查看角度 · 右0° 上90°</span></div><div class="readout"><div class="chart-head"><span>摇杆角度 · 最近 8 秒</span><b id="angle-current">--°</b></div><canvas id="angle-chart" height="130" aria-label="摇杆输入角度折线图，右方为零度，上方为九十度"></canvas></div><div class="readout"><div class="metric"><small>输入角度</small><b id="angle">-</b></div><div class="metric"><small>输入力度</small><b id="radius">-</b></div><div class="metric"><small>主方向</small><b id="primary">-</b></div><div class="metric"><small>控制方向</small><b id="resolved">-</b></div><div class="metric"><small>角色位置</small><b id="position">-</b></div><div class="metric"><small>备用方向</small><b id="secondary">-</b></div></div></section>
<aside class="panel"><details open><summary>控制参数</summary><div class="control"><div class="control-head"><label for="deadzone">死区比例</label><span class="value" id="deadzoneValue"></span></div><input id="deadzone" type="range" min="0" max="0.35" step="0.01" value="0.01"><div class="hint">最短轨迹段距离，按摇杆半径换算。</div></div><div class="control"><div class="control-head"><label for="hysteresis">方向滞回角</label><span class="value" id="hysteresisValue"></span></div><input id="hysteresis" type="range" min="0" max="90" step="1" value="19"></div><div class="control"><div class="control-head"><label for="buffer">转向缓冲</label><span class="value" id="bufferValue"></span></div><input id="buffer" type="range" min="0" max="240" step="10" value="10"></div><label for="diagonalMode">斜向操作</label><select id="diagonalMode"><option value="preserve">保持当前方向</option><option value="secondary">允许斜向换轴</option></select><div class="hint">默认斜推不换轴。</div><div class="control"><div class="control-head"><label for="diagMin">斜向起点</label><span class="value" id="diagMinValue"></span></div><input id="diagMin" type="range" min="0" max="45" step="1" value="14"></div><div class="control"><div class="control-head"><label for="diagMax">斜向终点</label><span class="value" id="diagMaxValue"></span></div><input id="diagMax" type="range" min="45" max="90" step="1" value="45"></div></details><details><summary>配置管理</summary><div class="buttons"><button id="reset">恢复默认</button><button id="copy">复制配置</button><button id="download">下载配置</button></div><div class="status" id="status"></div></details><details class="desktop-diagnostics"><summary>事件日志</summary><div class="log" id="log"></div></details></aside>
</div>
<script src="sim-bun-native-v5-facing-window.js"></script><script src="controls.js?v=trajectory-2"></script><script src="joystick-tuner.js?v=trajectory-2"></script>
</body></html>
