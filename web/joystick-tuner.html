<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>QQT 摇杆参数调试台</title>
<style>
:root{color-scheme:dark;--bg:#10171c;--panel:#172329;--line:#31434b;--text:#e9f2f3;--muted:#9db1b5;--accent:#64e0bc;--warn:#ffd166}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,sans-serif}main{max-width:1180px;margin:auto;padding:24px}h1{margin:0 0 6px;font-size:25px}h2{font-size:16px;margin:0 0 14px}.sub{color:var(--muted);margin:0 0 20px}.grid{display:grid;grid-template-columns:300px minmax(360px,1fr) 290px;gap:16px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px}.control{margin:0 0 18px}.control-head{display:flex;justify-content:space-between;gap:12px}.control label{font-weight:650}.value{color:var(--accent);font-variant-numeric:tabular-nums}input[type=range]{width:100%;accent-color:var(--accent);margin-top:7px}.hint{color:var(--muted);font-size:12px}.stage{display:grid;place-items:center;min-height:430px;background:#0d1317;border:1px solid var(--line);border-radius:6px}.arena{position:relative;width:min(78vw,420px);aspect-ratio:1;border:1px solid #46616a;background:repeating-linear-gradient(0deg,transparent 0 39px,#22343a 40px),repeating-linear-gradient(90deg,transparent 0 39px,#22343a 40px)}.target{position:absolute;left:62%;top:22%;width:38px;height:38px;border:3px solid #ef6c7b;border-radius:50%;transform:translate(-50%,-50%)}.player{position:absolute;left:50%;top:55%;width:25px;height:25px;border-radius:50%;background:var(--accent);transform:translate(-50%,-50%);box-shadow:0 0 18px #64e0bc99}.crosshair{position:absolute;inset:50%;width:2px;height:2px;background:#fff;box-shadow:0 -90px 0 2px #ffffff55,0 90px 0 2px #ffffff55,90px 0 0 2px #ffffff55,-90px 0 0 2px #ffffff55}.stick{position:absolute;left:10%;bottom:8%;width:112px;height:112px;border:1px solid #597079;border-radius:50%;background:#101a1eaa;touch-action:none}.stick-ring{position:absolute;inset:20%;border:1px dashed #617d85;border-radius:50%}.knob{position:absolute;left:50%;top:50%;width:40px;height:40px;border-radius:50%;background:#64e0bc;transform:translate(-50%,-50%);pointer-events:none}.readout{display:grid;grid-template-columns:1fr 1fr;gap:8px}.metric{padding:9px;background:#10191d;border:1px solid #293a41;border-radius:5px}.metric b{display:block;color:var(--accent);font-size:17px}.metric small{color:var(--muted)}button{border:1px solid #597079;background:#21343a;color:var(--text);padding:9px 11px;border-radius:5px;cursor:pointer}button:hover{border-color:var(--accent)}.buttons{display:flex;gap:8px;flex-wrap:wrap}.log{height:250px;overflow:auto;background:#0b1114;padding:9px;font:12px ui-monospace,monospace;color:#b9cbce;white-space:pre-wrap}.status{color:var(--warn);min-height:22px;margin-top:10px}@media(max-width:900px){main{padding:14px}.grid{grid-template-columns:1fr}.stage{min-height:360px}.arena{width:min(90vw,420px)}}
.arena{width:100%;aspect-ratio:auto;background:none}.stage{min-height:0}.arena canvas{display:block;width:100%;height:auto}#direction-zone{position:relative;height:132px;touch-action:none;user-select:none;background:#101a1e;border-top:1px solid var(--line);overflow:hidden}.touch-stick{position:absolute;left:50%;top:50%;width:96px;height:96px;transform:translate(-50%,-50%);display:grid;place-items:center;border:1px solid #597079;border-radius:50%;color:var(--accent);font-size:34px;pointer-events:none}#direction-zone[data-active=true] .touch-stick{background:#20383a}@media(max-width:900px){.grid>section:nth-child(2){order:-1}}
</style>
</head>
<body><main>
<h1>QQT 摇杆参数调试台</h1><p class="sub">拖动圆形摇杆，观察手指输入、方向解析和角色响应。参数只保存在本设备，不会影响正式游戏。</p>
<div class="grid">
<section class="panel"><h2>控制参数</h2>
<div class="control"><div class="control-head"><label for="deadzone">死区比例</label><span class="value" id="deadzoneValue"></span></div><input id="deadzone" type="range" min="0" max="0.35" step="0.01" value="0.18"><div class="hint">越小越灵敏，越大越不容易误触。</div></div>
<div class="control"><div class="control-head"><label for="hysteresis">方向滞回角</label><span class="value" id="hysteresisValue"></span></div><input id="hysteresis" type="range" min="0" max="90" step="1" value="58"><div class="hint">越大越稳定，但快速转向更迟钝。</div></div>
<div class="control"><div class="control-head"><label for="buffer">转向缓冲</label><span class="value" id="bufferValue"></span></div><input id="buffer" type="range" min="0" max="240" step="10" value="160"><div class="hint">斜向转弯等待时间，越小越快接管。</div></div>
<div class="control"><div class="control-head"><label for="diagMin">斜向起点</label><span class="value" id="diagMinValue"></span></div><input id="diagMin" type="range" min="0" max="45" step="1" value="25"></div>
<div class="control"><div class="control-head"><label for="diagMax">斜向终点</label><span class="value" id="diagMaxValue"></span></div><input id="diagMax" type="range" min="45" max="90" step="1" value="65"></div>
<div class="buttons"><button id="reset">恢复默认</button><button id="copy">复制配置</button><button id="download">下载配置</button></div><div class="status" id="status"></div>
</section>
<section class="panel"><h2>墙角试跑</h2><p class="hint">向右前进，在开口处斜推向上。<button id="restart">回到起点</button></p><div class="stage"><div class="arena" id="arena"><canvas id="board" width="600" height="520" aria-label="墙角试跑地图"></canvas><div id="direction-zone" data-floating-direction aria-label="摇杆区"><div class="touch-stick">✥</div></div></div></div></section>
<section class="panel"><h2>输入诊断</h2><div class="readout"><div class="metric"><small>原始角度</small><b id="angle">-</b></div><div class="metric"><small>原始力度</small><b id="radius">-</b></div><div class="metric"><small>主方向</small><b id="primary">-</b></div><div class="metric"><small>备用方向</small><b id="secondary">-</b></div><div class="metric"><small>最终方向</small><b id="resolved">-</b></div><div class="metric"><small>角色位置</small><b id="position">中心</b></div></div><h2 style="margin-top:20px">事件日志</h2><div class="log" id="log"></div></section>
</div></main><script src="sim-bun-native-v5-facing-window.js"></script><script src="controls.js"></script><script src="joystick-tuner.js"></script></body></html>
