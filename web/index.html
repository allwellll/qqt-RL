<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>qqt-RL · 抢包子真人测试</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <section class="arena">
      <div class="stage">
        <canvas id="game" width="900" height="880" aria-label="抢包子对战画面"></canvas>
        <div id="loading" class="loading" role="status" aria-live="polite">
          <div class="loading-bubble" aria-hidden="true"></div>
          <p id="loading-text">正在加载地图与素材…</p>
          <progress id="loading-progress" max="100" value="0"></progress>
        </div>
        <section id="settlement" class="settlement" role="region" aria-label="本局结算" aria-live="polite" hidden>
          <h2 id="settlement-title"></h2>
          <p id="settlement-time"></p>
          <p id="settlement-rank"></p>
          <p id="settlement-status" class="note"></p>
          <button id="play-again" type="button">再来一局 · 按 R</button>
        </section>
      </div>
      <aside>
        <section class="leaderboard" aria-labelledby="leaderboard-heading">
          <h2 id="leaderboard-heading">用户排行榜 · Top 20</h2>
          <div class="leaderboard-table-wrap">
            <table class="leaderboard-table" aria-label="用户排行榜">
              <caption>最佳获胜用时 · 无胜局显示 —</caption>
              <thead><tr><th scope="col" class="rank">排名</th><th scope="col" class="player">昵称</th><th scope="col" class="best-win">最佳胜利用时</th><th scope="col" class="message">宣言</th><th scope="col" class="ip">脱敏 IP</th></tr></thead>
              <tbody id="leaderboard-list"></tbody>
            </table>
          </div>
          <p id="leaderboard-empty" class="note">暂无排行榜数据</p>
          <div class="leaderboard-actions">
            <p id="leaderboard-status" class="note" role="status" aria-live="polite">正在连接排行榜…</p>
            <button id="leaderboard-retry" type="button">刷新 / 重试</button>
          </div>
          <details class="profile-settings fold">
            <summary>昵称与宣言</summary>
            <form id="leaderboard-profile">
              <label for="player-nickname">昵称</label>
              <input id="player-nickname" maxlength="24" required autocomplete="nickname">
              <label for="player-message">胜利宣言</label>
              <input id="player-message" maxlength="80" autocomplete="off">
              <button type="submit">保存</button>
            </form>
          </details>
        </section>
        <button id="restart" type="button">重新开局</button>
        <label>人物
          <span class="character-picker">
            <img id="character-portrait" src="assets/native/maomao_portrait.png" alt="毛毛" width="48" height="64">
            <select id="character"><option value="pipi">皮皮</option><option value="maomao" selected>毛毛</option></select>
          </span>
        </label>
        <h2>操作</h2>
        <p><kbd>方向键</kbd> 移动</p>
        <p><kbd>Space / W</kbd> 放泡</p>
        <p><kbd>1 - 7</kbd> 使用道具栏对应格（左下角）</p>
        <p><kbd>E / Shift</kbd> 使用道具栏第 1 格</p>
        <p>糖泡：队友碰触救援</p>
        <p><kbd>R</kbd> 重新开局</p>
        <label class="check-label"><input id="sound-toggle" type="checkbox" checked> 音效</label>
        <h2>对手</h2>
        <label>地图
          <select id="map-select">
            <option value="training806">训练地图 806（真实抢包子）</option>
            <option value="arena">空场竞技场（能力测试）</option>
          </select>
        </label>
        <label>对局模式
          <select id="match-mode">
            <option value="human-vs-opponent">真人 vs 对手</option>
            <option value="model-vs-rule">模型 vs 规则Bot（观战）</option>
          </select>
        </label>
        <label>队伍
          <select id="team-mode">
            <option value="1v1">1v1</option>
            <option value="1v2" selected>1v2（你 vs 两个猎手，可互救）</option>
            <option value="2v2">2v2（你 + 猎手队友 vs 两个猎手）</option>
          </select>
        </label>
        <label>策略
          <select id="opponent">
            <optgroup label="协作猎手">
              <option value="bun.coop_hunter@normal">协作猎手 · 普通</option>
              <option value="bun.coop_hunter@hard" selected>协作猎手 · 困难</option>
            </optgroup>
            <optgroup label="猎手 Bot：躲泡 + 进攻 + 偷包子">
              <option value="bun.hunter@easy">猎手 · 简单</option>
              <option value="bun.hunter@normal">猎手 · 普通</option>
              <option value="bun.hunter@hard">猎手 · 困难</option>
            </optgroup>
            <optgroup label="规则 Bot（仅 1v1）">
              <option value="bun.tactical_v2">安全战术规则 Bot</option>
              <option value="bun.random_roam">随机漫游 Bot</option>
            </optgroup>
            <optgroup id="model-options" label="训练模型（仅 1v1，选择后下载）"></optgroup>
          </select>
        </label>
        <p id="model-details" class="note"></p>
        <div id="model-progress-wrap" class="progress-wrap" hidden>
          <progress id="model-progress" max="100" value="0"></progress>
          <span id="model-progress-text">准备下载…</span>
        </div>
        <p id="model-status" class="note" aria-live="polite"></p>
        <details class="fold">
        <summary>离线实战录像</summary>
        <label>固定seed对局
          <select id="replay-select"><option value="">正在读取录像列表…</option></select>
        </label>
        <div class="replay-controls">
          <button id="replay-toggle" type="button">播放</button>
          <button id="replay-restart" type="button">从头播放</button>
          <select id="replay-speed" aria-label="录像速度">
            <option value="0.5">0.5×</option><option value="1" selected>1×</option>
            <option value="2">2×</option><option value="4">4×</option>
          </select>
        </div>
        <input id="replay-seek" type="range" min="0" max="0" value="0" step="1" aria-label="录像进度">
        <p id="replay-status" class="note" aria-live="polite"></p>
        </details>
        <details class="fold">
        <summary>状态</summary>
        <pre id="status">正在加载 Bun06…</pre>
        </details>
      </aside>
    </section>
  </main>
  <script src="sim.js"></script>
  <script src="controls.js"></script>
  <script src="model_catalog.js"></script>
  <script src="model_loader.js"></script>
  <script src="replay.js"></script>
  <script src="tactical_arena.js"></script>
  <script src="bun_rule_bot.js"></script>
  <script src="bun_hunter_bot.js"></script>
  <script src="bun_coop_hunter_bot.js"></script>
  <script src="bot_contract.js"></script>
  <script src="visual_renderer.js"></script>
  <script src="sound.js"></script>
  <script src="leaderboard_config.js"></script>
  <script src="leaderboard.js"></script>
  <script src="app.js"></script>
</body>
</html>
