<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>qqt-RL · 抢包子真人测试</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <section class="arena">
      <div class="stage">
        <canvas id="game" width="900" height="880" aria-label="抢包子对战画面"></canvas>
        <nav id="touch-controls" class="touch-controls" aria-label="触屏游戏操作">
          <div class="touch-directions" data-floating-direction aria-label="浮动方向区：按住滑动移动">
            <div class="touch-stick" aria-hidden="true"><span data-arrow="ArrowUp">↑</span><span data-arrow="ArrowLeft">←</span><span data-arrow="ArrowDown">↓</span><span data-arrow="ArrowRight">→</span></div>
          </div>
          <div class="touch-actions">
            <div class="touch-bomb-hit" data-control-key="Space"><button type="button" aria-label="放泡">放泡</button></div>
            <button type="button" class="touch-item" data-control-key="Digit1" data-touch-item="0" aria-label="使用槽位1，空槽"><span class="touch-slot-number">1</span><canvas width="32" height="32" aria-hidden="true"></canvas><span class="touch-slot-count">空</span></button>
            <button type="button" class="touch-item" data-control-key="Digit2" data-touch-item="1" aria-label="使用槽位2，空槽"><span class="touch-slot-number">2</span><canvas width="32" height="32" aria-hidden="true"></canvas><span class="touch-slot-count">空</span></button>
            <button type="button" class="touch-item" data-control-key="Digit3" data-touch-item="2" aria-label="使用槽位3，空槽"><span class="touch-slot-number">3</span><canvas width="32" height="32" aria-hidden="true"></canvas><span class="touch-slot-count">空</span></button>
            <button type="button" id="touch-item-page" class="touch-item-page" hidden aria-label="切换显示的道具槽">槽1–3 / 7　换页 ▶</button>
          </div>
        </nav>
        <div id="loading" class="loading" role="status" aria-live="polite">
          <div class="loading-bubble" aria-hidden="true"></div>
          <p id="loading-text">正在加载地图与素材…</p>
          <progress id="loading-progress" max="100" value="0"></progress>
          <p id="loading-source" class="note"></p>
          <button id="loading-retry" type="button" hidden>重试</button>
        </div>
        <section id="settlement" class="settlement" role="region" aria-label="本局结算" aria-live="polite" hidden>
          <button id="settlement-close" class="close-button" type="button" aria-label="关闭结算">×</button>
          <div class="sr-only"><h2 id="settlement-title"></h2>
          <p id="settlement-time"></p>
          <p id="settlement-rank"></p>
          </div><p id="settlement-status" class="note" role="status"></p>
          <form id="settlement-form">
            <div class="profile-fields">
              <label id="nickname-field">昵称（首次玩家）<input id="player-nickname" maxlength="24" required autocomplete="nickname" placeholder="起一个响亮的名字"></label>
              <label>胜利感言<input id="player-message" maxlength="80" autocomplete="off" placeholder="留空保留原感言"></label>
            </div>
            <p id="current-nickname" class="current-nickname" hidden></p>
            <button id="settlement-submit" type="submit">提交</button>
          </form>
        </section>
      </div>
      <aside>
        <div class="aside-toolbar"><button id="announcement-open" type="button"><span aria-hidden="true">★</span> 公告</button></div>
        <section class="leaderboard" aria-labelledby="leaderboard-heading">
          <h2 id="leaderboard-heading">胜局排行榜 · Top 20</h2><label>规则分榜 <select id="leaderboard-ruleset"><option value="bun-native-v4-facing">bun-native-v4-facing</option></select></label>
          <div class="leaderboard-table-wrap">
            <table class="leaderboard-table" aria-label="胜局排行榜">
              <thead><tr><th scope="col" class="rank">排名</th><th scope="col" class="player">昵称</th><th scope="col" class="best-win">本局胜利用时</th><th scope="col" class="message">胜利感言</th><th scope="col" class="ip">脱敏 IP</th></tr></thead>
              <tbody id="leaderboard-list"></tbody>
            </table>
          </div>
          <p id="leaderboard-empty" class="note">暂无排行榜数据</p>
          <div class="leaderboard-actions">
            <p id="leaderboard-status" class="note" role="status" aria-live="polite">正在连接排行榜…</p>
            <button id="leaderboard-retry" type="button">刷新 / 重试</button>
          </div>

        </section>
        <label>人物
          <span class="character-picker">
            <img id="character-portrait" src="assets/native/maomao_portrait.png" alt="毛毛" width="48" height="64">
            <select id="character"><option value="pipi">皮皮</option><option value="maomao" selected>毛毛</option></select>
          </span>
        </label>
        <label>玩法模式
          <select id="game-mode" aria-label="玩法模式">
            <option value="kill" selected>纯击杀（默认）</option>
            <option value="carry">正常运包</option>
          </select>
        </label>
        <input id="boundary-recovery" type="checkbox" checked hidden>
        <button id="advanced-open" type="button" aria-expanded="false" aria-controls="advanced-settings">高阶设置</button>
        <section id="advanced-settings" hidden>
        <button id="advanced-close" type="button">关闭高阶设置</button>
        <button id="advanced-forget" type="button">忘记本设备授权 / 锁定高阶设置</button>
        <a href="review.html">回放诊断台</a>
        <a id="latest-model-review" href="promotion-review.html" target="_blank" rel="noopener">历史五槽 u9809 · 固定8局Review（只读）</a>
        <a href="training.html">JE10 训练结果</a>
        <button id="restart" type="button">重新开局</button>
        <button id="pending-submit" type="button">查看未完成的结算</button>
        <label class="check-label"><input id="sound-toggle" type="checkbox" checked> 音效</label>
        <h2>对手</h2>
        <label>策略
          <select id="opponent">
            <optgroup id="model-options" label="模型"></optgroup>
          </select>
        </label>
        <div id="model-progress-wrap" class="progress-wrap" hidden>
          <progress id="model-progress" max="100" value="0"></progress>
          <span id="model-progress-text">准备下载…</span>
        </div>
        <p id="model-status" class="note" aria-live="polite"></p>
        <details class="fold">
        <summary>离线实战录像</summary>
        <label>固定seed对局
          <select id="replay-select"><option value="">正在读取录像列表…</option></select>
        </label>
        <div class="replay-controls">
          <button id="replay-toggle" type="button">播放</button>
          <button id="replay-restart" type="button">从头播放</button>
          <select id="replay-speed" aria-label="录像速度">
            <option value="0.5">0.5×</option><option value="1" selected>1×</option>
            <option value="2">2×</option><option value="4">4×</option>
          </select>
        </div>
        <input id="replay-seek" type="range" min="0" max="0" value="0" step="1" aria-label="录像进度">
        <p id="replay-status" class="note" aria-live="polite"></p>
        </details>
        <details class="fold" hidden>
        <summary hidden>状态</summary>
        <pre id="status" hidden>正在加载 Bun06…</pre>
        </details>
        </section>
      </aside>
    </section>
  </main>
  <dialog id="password-dialog" class="game-dialog" aria-labelledby="password-title">
    <button type="button" class="close-button" data-dialog-close aria-label="关闭密码框">×</button>
    <h2 id="password-title">高阶设置</h2>
    <form id="password-form"><label>请输入设置密码<input id="settings-password" type="password" autocomplete="off" required></label>
      <p id="password-status" role="status">验证成功后记住本设备。</p><button type="submit">解锁</button></form>
  </dialog>
  <dialog id="announcement-dialog" class="game-dialog" aria-labelledby="announcement-title">
    <button type="button" class="close-button" data-dialog-close aria-label="关闭公告">×</button>
    <h2 id="announcement-title">公告</h2>
    <p>作者想研制一个抢包子AI，用于玩家练习对战技巧，看一下和顶尖玩家的水平差距。</p>
    <p>当前仍是初级版本，还在测试不同方法效果。</p>
    <p>项目反馈与讨论请使用公开项目仓库。</p>
  </dialog>
  <script src="device_auth.js"></script>
  <script src="ui_panels.js"></script>
  <script src="sim-bun-native-v4-facing.js"></script>
  <script src="r3_model_inputs.js"></script>
  <script src="five-item-slots-v1.js"></script>
  <script src="five-item-slots-model-v1.js"></script>
  <script src="boundary-recovery-v1.js"></script>
  <script src="ruleset_selector.js"></script>
  <script src="controls.js"></script>
  <script src="model_catalog.js"></script>
  <script src="model_loader.js"></script>
  <script src="model_sampling_v1.js"></script>
  <script src="model_worker.js"></script>
  <script src="replay.js"></script>
  <script src="tactical_arena.js"></script>
  <script src="bot_contract.js"></script>
  <script src="visual_renderer.js"></script>
  <script src="sound.js"></script>
  <script src="leaderboard_config.js"></script>
  <script src="leaderboard.js"></script>
  <script src="self_respawn_preview.js"></script>
  <script src="kill_opening_items.js"></script>
  <script src="app.js"></script>
</body>
</html>
