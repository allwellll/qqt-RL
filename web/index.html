<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>qqt-RL · 抢包子真人测试</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <div>
        <p class="eyebrow">QQT-RL / BUN ONLY</p>
        <h1>抢包子06 · 空砖近距战术真人测试</h1>
      </div>
      <button id="restart" type="button">重新开局</button>
    </header>
    <section class="arena">
      <canvas id="game" width="900" height="810" aria-label="抢包子对战画面"></canvas>
      <aside>
        <h2>操作</h2>
        <p><kbd>方向键 / W A S D</kbd> 移动</p>
        <p><kbd>Space</kbd> 放泡</p>
        <p><kbd>R</kbd> 重新开局</p>
        <h2>对手</h2>
        <label>对局模式
          <select id="match-mode">
            <option value="human-vs-opponent">真人 vs 对手</option>
            <option value="model-vs-rule">模型 vs 规则Bot（观战）</option>
          </select>
        </label>
        <label>策略
          <select id="opponent">
            <option value="bun.tactical_v2">安全战术规则 Bot</option>
            <option value="bun.random_roam">随机漫游 Bot</option>
            <option value="bun.browser_model">本地导出模型</option>
          </select>
        </label>
        <label class="file-label">已发布模型
          <select id="published-model">
            <option value="">正在读取模型列表…</option>
          </select>
        </label>
        <p id="model-details" class="note">选择模型后按需下载；模型权重不进入Git历史。</p>
        <div id="model-progress-wrap" class="progress-wrap" hidden>
          <progress id="model-progress" max="100" value="0"></progress>
          <span id="model-progress-text">准备下载…</span>
        </div>
        <details class="advanced">
          <summary>高级：加载本地模型 JSON</summary>
        <label class="file-label">本地模型 JSON
          <input id="model-file" type="file" accept="application/json,.json">
        </label>
        </details>
        <p id="model-status" class="note" aria-live="polite">尚未加载模型；请从上方已发布模型列表选择。</p>
        <h2>离线实战录像</h2>
        <label>固定seed对局
          <select id="replay-select"><option value="">正在读取录像列表…</option></select>
        </label>
        <div class="replay-controls">
          <button id="replay-toggle" type="button">播放</button>
          <button id="replay-restart" type="button">从头播放</button>
          <select id="replay-speed" aria-label="录像速度">
            <option value="0.5">0.5×</option><option value="1" selected>1×</option>
            <option value="2">2×</option><option value="4">4×</option>
          </select>
        </div>
        <input id="replay-seek" type="range" min="0" max="0" value="0" step="1" aria-label="录像进度">
        <p id="replay-status" class="note" aria-live="polite">录像只保存固定seed、模型哈希和每tick双方动作，不重复保存地图或完整状态。</p>
        <h2>状态</h2>
        <pre id="status">正在加载 Bun06…</pre>
        <p class="note">蓝方为真人，红方可选冻结规则 Bot 或本地导出的训练模型。默认复现训练使用的空砖近距竞技场：保留不可炸墙和包子笼，清空可炸砖。</p>
      </aside>
    </section>
  </main>
  <script src="sim.js"></script>
  <script src="controls.js"></script>
  <script src="model_catalog.js"></script>
  <script src="model_loader.js"></script>
  <script src="replay.js"></script>
  <script src="tactical_arena.js"></script>
  <script src="bun_rule_bot.js"></script>
  <script src="bot_contract.js"></script>
  <script src="visual_renderer.js"></script>
  <script src="app.js"></script>
</body>
</html>
