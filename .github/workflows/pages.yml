name: Deploy Bun rule-bot web to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-production
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test Bun-only web
        run: npm test
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Assemble static site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _site
          cp -a web/. _site/
          mkdir -p _site/models
          gh release download web-models-v1 --repo "${{ github.repository }}" \
            --pattern 'safe-*.json' --dir _site/models
          python3 - <<'PY'
          import hashlib, json, pathlib
          root = pathlib.Path('_site')
          manifest = json.loads((root / 'models.json').read_text())
          for row in manifest['models']:
              data = (root / 'models' / row['file']).read_bytes()
              assert len(data) == row['bytes'], (row['id'], len(data), row['bytes'])
              assert hashlib.sha256(data).hexdigest() == row['sha256'], row['id']
          print(f"verified {len(manifest['models'])} same-origin web models")
          PY
          touch _site/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          retention-days: 1

  deploy:
    needs: test-and-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
