name: Deploy Bun rule-bot web to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-production
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test Bun-only web
        run: npm ci && npm test && npm run test:review
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Assemble static site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _site
          cp -a web/. _site/
          mkdir -p _site/reports _site/docs/assets
          cp reports/mainline_timeline_20261028.html reports/mainline_timeline_20261106.html reports/mainline_timeline_evidence_20261106.json reports/publish_k1_u5282_20261101.md reports/web_model_promotion_20261104.md _site/reports/
          cp docs/assets/mainline_timeline_20261106.svg docs/assets/mainline_timeline_20261106.json _site/docs/assets/
          cp docs/combat_league_v2_training_path_20261106.md docs/current_web_and_training_status_20261107.md _site/docs/
          node scripts/assemble_web_runtime.js _site/vendor/ort
          node -e 'require("fs").writeFileSync("_site/build-info.json", JSON.stringify({version:"leaderboard-v1",ruleset_version:"bun-native-v4-facing",commit:process.env.GITHUB_SHA}) + "\n")'
          mkdir -p _site/models
          python3 scripts/fetch_web_models.py --manifest web/models.json --output _site/models
          python3 - <<'PY'
          import hashlib, json, pathlib
          root = pathlib.Path('_site')
          manifest = json.loads((root / 'models.json').read_text())
          for row in manifest['models']:
              for asset in [row] + ([row['onnx']] if row.get('onnx') else []):
                  data = (root / 'models' / asset['file']).read_bytes()
                  assert len(data) == asset['bytes'], (row['id'], len(data), asset['bytes'])
                  assert hashlib.sha256(data).hexdigest() == asset['sha256'], row['id']
          print(f"verified {len(manifest['models'])} same-origin web models")
          PY
          touch _site/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          retention-days: 1

  deploy:
    needs: test-and-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1200000
