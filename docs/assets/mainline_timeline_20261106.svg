<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="3565" viewBox="0 0 1080 3565" role="img" aria-labelledby="title desc"><title id="title">主线优化与发布轨迹 · 2026-11-06</title><desc id="desc">it831 至 D、K1、五槽发布、G_frozen 和联赛v2最佳；不同评估口径以虚线分隔。</desc><rect width="100%" height="100%" fill="#f5f8fc"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif"><text x="32" y="43" font-size="27" fill="#172e49" font-weight="bold">QQ堂 RL · 主线优化与发布轨迹</text><text x="34" y="77" font-size="17" fill="#536277">2026-11-06 · 最佳训练点与线上发布分列 · 数字可追溯原始评估</text><path d="M119 122V245" stroke="#cbd8e7" stroke-width="3"/><circle cx="119" cy="144" r="7" fill="#387ab1"/><rect x="144" y="122" width="901" height="103" rx="9" fill="white" stroke="#dce3ec" stroke-width="1"/><text x="32" y="150" font-size="17" fill="#536277" font-weight="bold">≤09-24</text><text x="162" y="152" font-size="19" fill="#172e49" font-weight="bold">it831 · 旧对战模式旗舰（qqt-gpu-sim）</text><text x="162" y="181" font-size="16" fill="#475569" font-weight="normal">做了什么  ViT embed392，联赛对手+自对弈，开阔地图，约173亿步</text><text x="162" y="205" font-size="16" fill="#14683c" font-weight="normal">效果  会打架；没有运包任务</text><path d="M119 243V366" stroke="#cbd8e7" stroke-width="3"/><circle cx="119" cy="265" r="7" fill="#387ab1"/><rect x="144" y="243" width="901" height="103" rx="9" fill="white" stroke="#dce3ec" stroke-width="1"/><text x="32" y="271" font-size="17" fill="#536277" font-weight="bold">10-11</text><text x="162" y="273" font-size="19" fill="#172e49" font-weight="bold">Bun392 g0 · 权重迁移，无训练</text><text x="162" y="302" font-size="16" fill="#475569" font-weight="normal">做了什么  it831 主干原样拷贝；Bun新增的输入通道/状态/技能头随机初始化</text><text x="162" y="326" font-size="16" fill="#14683c" font-weight="normal">效果  对拼 0/4/15，Tactical 22/64；持包回家 1/16，整局交付 0/16</text><path d="M119 364V487" stroke="#cbd8e7" stroke-width="3"/><circle cx="119" cy="386" r="7" fill="#387ab1"/><rect x="144" y="364" width="901" height="103" rx="9" fill="white" stroke="#dce3ec" stroke-width="1"/><text x="32" y="392" font-size="17" fill="#536277" font-weight="bold">10-11</text><text x="162" y="394" font-size="19" fill="#172e49" font-weight="bold">JE03 S1 g2048 · 保住对战底子再学运包</text><text x="162" y="423" font-size="16" fill="#475569" font-weight="normal">做了什么  retention_v2奖励；g0 actor KL .08 + 45%战斗回放；对手 rule .35 + 冻结旧模型 .65</text><text x="162" y="447" font-size="16" fill="#14683c" font-weight="normal">效果  对拼 2/4/10；持包回家 1→14/16；整局交付仍 0/16</text><path d="M119 485V608" stroke="#cbd8e7" stroke-width="3"/><circle cx="119" cy="507" r="7" fill="#d99723"/><rect x="144" y="485" width="901" height="103" rx="9" fill="white" stroke="#dce3ec" stroke-width="1"/><text x="32" y="513" font-size="17" fill="#536277" font-weight="bold">10-12</text><text x="162" y="515" font-size="19" fill="#172e49" font-weight="bold">JE03 S2 g3072 · 动态自对弈 · 网页发布</text><text x="162" y="544" font-size="16" fill="#475569" font-weight="normal">做了什么  对手加入 recent/history 自身快照；lr 2e-4→7.5e-5，clip .2→.1</text><text x="162" y="568" font-size="16" fill="#14683c" font-weight="normal">效果  对拼 0/4/23；持包回家 14/16。发布为网页 selfplay3072</text><path d="M119 606V729" stroke="#cbd8e7" stroke-width="3"/><circle cx="119" cy="628" r="7" fill="#d99723"/><rect x="144" y="606" width="901" height="103" rx="9" fill="white" stroke="#dce3ec" stroke-width="1"/><text x="32" y="634" font-size="17" fill="#536277" font-weight="bold">10-13</text><text x="162" y="636" font-size="19" fill="#172e49" font-weight="bold">JE05 g1536 · 战斗+运输奖励，PFSP联赛 · 网页发布</text><text x="162" y="665" font-size="16" fill="#475569" font-weight="normal">做了什么  combat_transport_v1：战斗/安全 + 有界路线 + 偷包.75 + 交付24；对手 rule/g0/S1老师/联赛</text><text x="162" y="689" font-size="16" fill="#14683c" font-weight="normal">效果  对拼 3/1/32；持包回家 15/16；整局交付 0/16。发布为网页 transport1536</text><path d="M119 727V850" stroke="#cbd8e7" stroke-width="3"/><circle cx="119" cy="749" r="7" fill="#387ab1"/><rect x="144" y="727" width="901" height="103" rx="9" fill="white" stroke="#dce3ec" stroke-width="1"/><text x="32" y="755" font-size="17" fill="#536277" font-weight="bold">10-13</text><text x="162" y="757" font-size="19" fill="#172e49" font-weight="bold">JE07 g256 · 掉包回收</text><text x="162" y="786" font-size="16" fill="#475569" font-weight="normal">做了什么  经 JE06 中转；加归因拾取奖励8、掉包回收与持包辅助</text><text x="162" y="810" font-size="16" fill="#14683c" font-weight="normal">效果  对拼 2/10/26；持包回家 12/16</text><path d="M119 848V971" stroke="#cbd8e7" stroke-width="3"/><circle cx="119" cy="870" r="7" fill="#387ab1"/><rect x="144" y="848" width="901" height="103" rx="9" fill="white" stroke="#dce3ec" stroke-width="1"/><text x="32" y="876" font-size="17" fill="#536277" font-weight="bold">10-14</text><text x="162" y="878" font-size="19" fill="#172e49" font-weight="bold">JE08 g2048 · 拓扑势函数</text><text x="162" y="907" font-size="16" fill="#475569" font-weight="normal">做了什么  带符号持包势函数 .0625 + 掉包靠近 .05；H200 8卡续训</text><text x="162" y="931" font-size="16" fill="#14683c" font-weight="normal">效果  对拼 2/5/28；持包回家 16/16；去捡掉包 6/16、交付 4/16</text><path d="M119 969V1092" stroke="#cbd8e7" stroke-width="3"/><circle cx="119" cy="991" r="7" fill="#387ab1"/><rect x="144" y="969" width="901" height="103" rx="9" fill="white" stroke="#dce3ec" stroke-width="1"/><text x="32" y="997" font-size="17" fill="#536277" font-weight="bold">10-15</text><text x="162" y="999" font-size="19" fill="#172e49" font-weight="bold">JE09 v5 g8 · Stage A：去捡掉包</text><text x="162" y="1028" font-size="16" fill="#475569" font-weight="normal">做了什么  路线资格改为“当前格和下一格无原生危险”</text><text x="162" y="1052" font-size="16" fill="#14683c" font-weight="normal">效果  捡掉包 6→15/16，交付 4→11/16；对拼 3/0/26</text><path d="M119 1090V1213" stroke="#cbd8e7" stroke-width="3"/><circle cx="119" cy="1112" r="7" fill="#387ab1"/><rect x="144" y="1090" width="901" height="103" rx="9" fill="white" stroke="#dce3ec" stroke-width="1"/><text x="32" y="1118" font-size="17" fill="#536277" font-weight="bold">10-15</text><text x="162" y="1120" font-size="19" fill="#172e49" font-weight="bold">JE09 v7 g8 · Stage B：捡到后往回走</text><text x="162" y="1149" font-size="16" fill="#475569" font-weight="normal">做了什么  拾取后120 tick内里程碑奖励 ×4</text><text x="162" y="1173" font-size="16" fill="#14683c" font-weight="normal">效果  Stage B 交付 9/16</text><path d="M119 1211V1334" stroke="#cbd8e7" stroke-width="3"/><circle cx="119" cy="1233" r="7" fill="#387ab1"/><rect x="144" y="1211" width="901" height="103" rx="9" fill="white" stroke="#dce3ec" stroke-width="1"/><text x="32" y="1239" font-size="17" fill="#536277" font-weight="bold">10-15</text><text x="162" y="1241" font-size="19" fill="#172e49" font-weight="bold">JE09 v8 g8 · Stage C：返程动作集监督</text><text x="162" y="1270" font-size="16" fill="#475569" font-weight="normal">做了什么  拾取后用“安全最短返程动作集”做监督（DAgger雏形）</text><text x="162" y="1294" font-size="16" fill="#14683c" font-weight="normal">效果  Stage B 交付 9→15/16；对拼 2/3/29</text><path d="M119 1332V1455" stroke="#cbd8e7" stroke-width="3"/><circle cx="119" cy="1354" r="7" fill="#387ab1"/><rect x="144" y="1332" width="901" height="103" rx="9" fill="white" stroke="#dce3ec" stroke-width="1"/><text x="32" y="1360" font-size="17" fill="#536277" font-weight="bold">10-18</text><text x="162" y="1362" font-size="19" fill="#172e49" font-weight="bold">JE10 r01 · 路线控制整合</text><text x="162" y="1391" font-size="16" fill="#475569" font-weight="normal">做了什么  首控因果信用 + 连续PBRS .5 + 学习者状态DAgger .2</text><text x="162" y="1415" font-size="16" fill="#14683c" font-weight="normal">效果  真实掉包交付 0→11/16；自然整局交付 2→8/16</text><path d="M119 1453V1576" stroke="#cbd8e7" stroke-width="3"/><circle cx="119" cy="1475" r="7" fill="#387ab1"/><rect x="144" y="1453" width="901" height="103" rx="9" fill="white" stroke="#dce3ec" stroke-width="1"/><text x="32" y="1481" font-size="17" fill="#536277" font-weight="bold">10-18</text><text x="162" y="1483" font-size="19" fill="#172e49" font-weight="bold">JE10 r02–r10 · 每轮改一个因素</text><text x="162" y="1512" font-size="16" fill="#475569" font-weight="normal">做了什么  oracle、拓扑场、回放配额、砖块阻断等</text><text x="162" y="1536" font-size="16" fill="#14683c" font-weight="normal">效果  自然整局交付在 0–8/16 间波动，r10 末为 0/16</text><path d="M119 1574V1697" stroke="#cbd8e7" stroke-width="3"/><circle cx="119" cy="1596" r="7" fill="#387ab1"/><rect x="144" y="1574" width="901" height="103" rx="9" fill="white" stroke="#dce3ec" stroke-width="1"/><text x="32" y="1602" font-size="17" fill="#536277" font-weight="bold">10-18</text><text x="162" y="1604" font-size="19" fill="#172e49" font-weight="bold">JE10 r12 · 去掉人工持包</text><text x="162" y="1633" font-size="16" fill="#475569" font-weight="normal">做了什么  删除“开局直接持包”场景，持包必须来自真实拾取</text><text x="162" y="1657" font-size="16" fill="#14683c" font-weight="normal">效果  自然整局 0→2/16，换来干净的因果设定</text><path d="M119 1695V1818" stroke="#cbd8e7" stroke-width="3"/><circle cx="119" cy="1717" r="7" fill="#d74c44"/><rect x="144" y="1695" width="901" height="103" rx="9" fill="white" stroke="#dce3ec" stroke-width="1"/><text x="32" y="1723" font-size="17" fill="#536277" font-weight="bold">10-19</text><text x="162" y="1725" font-size="19" fill="#172e49" font-weight="bold">JE10 r19 g32 · 干净设定下续调 · 共同父点</text><text x="162" y="1754" font-size="16" fill="#475569" font-weight="normal">做了什么  r13–r19：返程查询配额、回放加权、FIFO 扩容等</text><text x="162" y="1778" font-size="16" fill="#14683c" font-weight="normal">效果  自然整局恢复到 6/16，真实掉包 11/16。成为后续全部实验的共同父点</text><path d="M30 1816H1050" stroke="#d99b28" stroke-dasharray="7 5"/><text x="35" y="1840" font-size="16" fill="#926415" font-weight="normal">10-19～10-25 支线未晋升；从 A 起换出生点与评估脚本，对拼数不与前段横比。</text><path d="M119 1879V2002" stroke="#cbd8e7" stroke-width="3"/><circle cx="119" cy="1901" r="7" fill="#387ab1"/><rect x="144" y="1879" width="901" height="103" rx="9" fill="white" stroke="#dce3ec" stroke-width="1"/><text x="32" y="1907" font-size="17" fill="#536277" font-weight="bold">10-25</text><text x="162" y="1909" font-size="19" fill="#172e49" font-weight="bold">A：PPO-SCALE R1 u064 · 纯PPO</text><text x="162" y="1938" font-size="16" fill="#475569" font-weight="normal">做了什么  legacy奖励，Bank 25%，对手只有 rule3，约100万步</text><text x="162" y="1962" font-size="16" fill="#14683c" font-weight="normal">效果  新口径对拼 0/0/0；网页整局 击杀38 / 交付31（64局）</text><path d="M119 2000V2123" stroke="#cbd8e7" stroke-width="3"/><circle cx="119" cy="2022" r="7" fill="#387ab1"/><rect x="144" y="2000" width="901" height="103" rx="9" fill="white" stroke="#dce3ec" stroke-width="1"/><text x="32" y="2028" font-size="17" fill="#536277" font-weight="bold">10-26</text><text x="162" y="2030" font-size="19" fill="#172e49" font-weight="bold">B：env2048 u160 · 大batch提吞吐</text><text x="162" y="2059" font-size="16" fill="#475569" font-weight="normal">做了什么  每卡2048环境，单卡 2.7千→2万步/秒，约4200万步</text><text x="162" y="2083" font-size="16" fill="#14683c" font-weight="normal">效果  对拼 0/1/10；网页整局 75/24；JAX交付 304/303</text><path d="M119 2121V2244" stroke="#cbd8e7" stroke-width="3"/><circle cx="119" cy="2143" r="7" fill="#387ab1"/><rect x="144" y="2121" width="901" height="103" rx="9" fill="white" stroke="#dce3ec" stroke-width="1"/><text x="32" y="2149" font-size="17" fill="#536277" font-weight="bold">10-27</text><text x="162" y="2151" font-size="19" fill="#172e49" font-weight="bold">C：COMBAT-MIX u320 · 混合对手 + 25%对拼课程</text><text x="162" y="2180" font-size="16" fill="#475569" font-weight="normal">做了什么  rule3/普通/困难/current/ring/父点混合，约4200万步</text><text x="162" y="2204" font-size="16" fill="#14683c" font-weight="normal">效果  对拼 3/7/9；网页整局 60/30；JAX交付 304/297</text><path d="M119 2242V2365" stroke="#cbd8e7" stroke-width="3"/><circle cx="119" cy="2264" r="7" fill="#d99723"/><rect x="144" y="2242" width="901" height="103" rx="9" fill="white" stroke="#dce3ec" stroke-width="1"/><text x="32" y="2270" font-size="17" fill="#536277" font-weight="bold">10-28</text><text x="162" y="2272" font-size="19" fill="#172e49" font-weight="bold">D：PBT slot05 u720 · 40%课程 + 连泡奖励 + 长训 · 10-28最佳</text><text x="162" y="2301" font-size="16" fill="#475569" font-weight="normal">做了什么  PBT 8条线，slot05一路未被替换；lr 6e-5，熵 .004，约1.05亿步</text><text x="162" y="2325" font-size="16" fill="#14683c" font-weight="normal">效果  对拼 25/41/39；JAX交付 304/302；网页整局未测</text><path d="M30 2363H1050" stroke="#d99b28" stroke-dasharray="7 5"/><text x="35" y="2387" font-size="16" fill="#926415" font-weight="normal">10-28 后：R1→R2 自由搬包/归属势差→R3 可见道具与本侧出生→R4 对拼；改用 bun-native-v2。</text><path d="M119 2426V2549" stroke="#cbd8e7" stroke-width="3"/><circle cx="119" cy="2448" r="7" fill="#d99723"/><rect x="144" y="2426" width="901" height="103" rx="9" fill="white" stroke="#dce3ec" stroke-width="1"/><text x="32" y="2454" font-size="17" fill="#536277" font-weight="bold">11-01</text><text x="162" y="2456" font-size="19" fill="#172e49" font-weight="bold">K1 u5282 · 已发布</text><text x="162" y="2485" font-size="16" fill="#475569" font-weight="normal">做了什么  在 R3-a u4002 上把对拼课程 10%→30%；保留三技能与本侧出生。</text><text x="162" y="2509" font-size="16" fill="#14683c" font-weight="normal">效果  P1 三档胜负差 +359（旧 +338）；hard holdout 111胜/9负/8平，旧113/10/5。</text><path d="M119 2547V2670" stroke="#cbd8e7" stroke-width="3"/><circle cx="119" cy="2569" r="7" fill="#d99723"/><rect x="144" y="2547" width="901" height="103" rx="9" fill="white" stroke="#dce3ec" stroke-width="1"/><text x="32" y="2575" font-size="17" fill="#536277" font-weight="bold">11-04</text><text x="162" y="2577" font-size="19" fill="#172e49" font-weight="bold">five-slot u9809 · 网页发布线</text><text x="162" y="2606" font-size="16" fill="#475569" font-weight="normal">做了什么  五槽独立技能/观测接入；配对补评后选 u9809，u9969 与 K1 保留回滚。</text><text x="162" y="2630" font-size="16" fill="#14683c" font-weight="normal">效果  v2 hard holdout P1 16胜/0负/0平；交付15、携包死0；因果杀5，旧K1为9。</text><path d="M30 2668H1050" stroke="#d99b28" stroke-dasharray="7 5"/><text x="35" y="2692" font-size="16" fill="#926415" font-weight="normal">路线切换：以下看三技能 G 对拼训练线；u9809 是同期网页发布点，不能当作 G 的父 checkpoint。</text><path d="M119 2731V2854" stroke="#cbd8e7" stroke-width="3"/><circle cx="119" cy="2753" r="7" fill="#d74c44"/><rect x="144" y="2731" width="901" height="103" rx="9" fill="white" stroke="#dce3ec" stroke-width="1"/><text x="32" y="2759" font-size="17" fill="#536277" font-weight="bold">11-04</text><text x="162" y="2761" font-size="19" fill="#172e49" font-weight="bold">G_frozen u18262 · 冻结强对手</text><text x="162" y="2790" font-size="16" fill="#475569" font-weight="normal">做了什么  G 联赛完整状态续训；u18102→多区域30%/自然70%，保留真实 Bank 与原生地图。</text><text x="162" y="2814" font-size="16" fill="#14683c" font-weight="normal">效果  原强评估双座自对弈 argmax 25胜/25负/38平，score .500；采样 .386。</text><path d="M30 2852H1050" stroke="#d99b28" stroke-dasharray="7 5"/><text x="35" y="2876" font-size="16" fill="#926415" font-weight="normal">强评估口径：对手固定 G_frozen argmax；44场景×双座，greedy 与 categorical 分列，不能与猎手胜数横比。</text><path d="M119 2915V3038" stroke="#cbd8e7" stroke-width="3"/><circle cx="119" cy="2937" r="7" fill="#387ab1"/><rect x="144" y="2915" width="901" height="103" rx="9" fill="white" stroke="#dce3ec" stroke-width="1"/><text x="32" y="2943" font-size="17" fill="#536277" font-weight="bold">11-05</text><text x="162" y="2945" font-size="19" fill="#172e49" font-weight="bold">CC/CX 联赛 v2 · peer 对手 + 自模仿</text><text x="162" y="2974" font-size="16" fill="#475569" font-weight="normal">做了什么  current/ring/固定历史 + 活跃 peer；SIL 只监督正优势放泡，bot floor 后续固定。</text><text x="162" y="2998" font-size="16" fill="#14683c" font-weight="normal">效果  早期 S05_sil u18662 对 G：P0 argmax 19胜/8负/17平；单座探索，不当双座确认。</text><path d="M119 3036V3183" stroke="#cbd8e7" stroke-width="3"/><circle cx="119" cy="3058" r="7" fill="#269856"/><rect x="144" y="3036" width="901" height="127" rx="9" fill="white" stroke="#269856" stroke-width="2"/><text x="32" y="3064" font-size="17" fill="#536277" font-weight="bold">11-06</text><text x="162" y="3066" font-size="19" fill="#172e49" font-weight="bold">L2_S05g u019302 · 已复测的强评估最佳</text><text x="162" y="3095" font-size="16" fill="#475569" font-weight="normal">做了什么  从 L2_S05 u19142 换 seed，SIL=.5、固定 bot floor；同 checkpoint 换新 seed 